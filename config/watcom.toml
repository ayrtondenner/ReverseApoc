# Original Watcom C/C++ CD images used to rebuild the game's compiler environment.
#
# The media is proprietary and is never committed to this repository. `uv run reverseapoc
# fetch-watcom` downloads it from the Internet Archive on explicit request, at the user's own
# responsibility, and verifies it against the hashes below (size, MD5, SHA-1, CRC32 when known).
#
# Mirrors with byte-identical ISOs:
#   WinWorld: https://winworldpc.com/product/watcom-c-c/105 , /106 , /110b
#     (25 downloads/day limit; the ISOs are inside .7z archives)
#   archive.org item `watcom-c-cpp-compilers-collection`: also holds the 11.0a/11.0b ISOs,
#     the 10.5a patch c105_a.zip and the 11.0c update.
# Download URL pattern: https://archive.org/download/<item>/<file>
#
# `file` may contain a sub-path inside the archive.org item; the local file name is its basename.
# `[[media.key_files]]` (path, size, md5, sha1, optional crc32, known_bad, note) lists files to
# verify after `install-watcom`; `path` is POSIX with the exact on-disc case.

[[media]]
version = "10.5"
item = "Watcom_C_10.5"
file = "Watcom_C++_10.5.iso"
size = 515213312
crc32 = 0x6BE5E3F6
md5 = "3200b70ba399c840775e9bfa2fe19875"
sha1 = "0722e7494647cd5e9a66bd106aa80a620f7ee999"

