# Optional per media: `skip_dirs` (damaged directories that install-watcom leaves out) and `note`.
# The only public 11.0b dump (WinWorld's copy is byte-identical) has sector 353, the directory
# extent of SAMPLES/WIN/DATACTL/WIN16, holding data instead of directory records.
skip_dirs = ["SAMPLES/WIN/DATACTL/WIN16"]
note = "The only public dump has a damaged directory sector (353) for the 3-file sample folder SAMPLES/WIN/DATACTL/WIN16; install-watcom skips it. 7-Zip cannot open this image."
