# The drive arms (Phase 07.2 plan 12; D-10, D-11, D-12, D-18), read by tools/reverseapoc/backends.py.
#
# This file holds NAMES of environment variables only, never a key. A hosted arm's key lives in
# the Windows user environment variable its `key_env` names (docs/toolchain.md, "Model API keys
# and sign-ins"); the driver copies it into that session's ANTHROPIC_AUTH_TOKEN and writes it
# nowhere.
#
# The endpoints, model ids and prices of the non-Anthropic arms were read on 2026-11-09
# (07.2-RESEARCH Q7) and are re-checked by the owner at setup, before each arm's canary.
#
# Fields: harness (claude, codex, agy), backend (the provider: anthropic is the Claude Code
# login), model (the --model id), base_url (absent on the Claude login), key_env (absent on the
# Claude login), sends_disassembly (true: the context pack leaves the machine, so a
# non-Anthropic arm needs --allow-egress, D-11), accepted_init (the init `model` strings
# accepted), prices (USD per million tokens, for the cost estimate), coauthor (the commit
# credit line, D-26), max_workers. The Claude arms are keyed by their model id and keep
# streamjson's tables and driver.coauthor (RULINGS "Harness").

[arms."claude-opus-5-5"]
harness = "claude"
backend = "anthropic"
model = "claude-opus-5-5"
sends_disassembly = true
max_workers = 10

[arms."claude-fable-5-1"]
harness = "claude"
backend = "anthropic"
model = "claude-fable-5-1"
sends_disassembly = true
max_workers = 10

[arms."claude-haiku-5-5"]
harness = "claude"
backend = "anthropic"
model = "claude-haiku-5-5"
sends_disassembly = true
max_workers = 10

[arms."claude-sonnet-5-5"]
harness = "claude"
backend = "anthropic"
model = "claude-sonnet-5-5"
sends_disassembly = true
max_workers = 10

# GPT-6 Luna and GPT-6.1 Sol through the Codex CLI on the owner's ChatGPT Plus login (07.2-13;
# D-12, D-13, D-18: third and fourth in the run order). No base_url and no key_env: Codex signs
# in with its own login, and the driver strips OPENAI_API_KEY and OPENAI_BASE_URL from the
# session. No init ids: `codex exec --json` streams no event naming the model, so the record
# keeps the requested model and a null `model`. Prices are 0: a Plus subscription is measured
# in tokens and its 5-hour windows, not in dollars. One worker for the Plus windows (the owner
# may raise max_workers). A Codex arm runs only after its canary passed on the installed CLI
# (build/driver/canary/<arm>.json). ASSUMPTION, confirm at setup: the ids `gpt-6-luna` and
# `gpt-6.1-sol` (RESEARCH Q8, from OpenAI's help page and CLI 0.159.1's catalogue) and the
# noreply@openai.com co-author address.
[arms."gpt-6-luna"]
harness = "codex"
backend = "openai"
model = "gpt-6-luna"
sends_disassembly = true
accepted_init = []
coauthor = "GPT-6 Luna <noreply@openai.com>"
max_workers = 1

[arms."gpt-6-luna".prices]
input = 0.0
output = 0.0
cache_read = 0.0
cache_creation = 0.0

[arms."gpt-6.1-sol"]
harness = "codex"
backend = "openai"
model = "gpt-6.1-sol"
sends_disassembly = true
accepted_init = []
coauthor = "GPT-6.1 Sol <noreply@openai.com>"
max_workers = 1

[arms."gpt-6.1-sol".prices]
input = 0.0
output = 0.0
cache_read = 0.0
cache_creation = 0.0

# Gemini 3.8 Flash and GPT-OSS 120B through the Antigravity CLI (agy) on the owner's Google AI
# Plus sign-in (07.2-15; D-21, D-24, D-25, D-25a: Gemini is fifth in the run order). No base_url
# and no key_env: agy signs in with its own login, and the driver strips every Google key and
# OpenAI variable from the session. The model ids are the exact slugs the owner's `agy models`
# listed on 2026-11-09 (agy 1.5.3); slugs vary per account and agy exits 1 on an unknown one,
# so a wrong id fails closed in the canary. The Gemini arm runs the medium effort; the owner may
# set `gemini-3.8-flash-high` or `-low` here for an effort comparison. Prices are 0: the AI
# Plus subscription is measured in its weekly quota, not in dollars (the canary measures it).
# One worker each. An agy arm runs only after its canary passed on the installed CLI
# (build/driver/canary/<arm>.json). GPT-OSS is open-weight, but the session still sends the
# pack to Google, so it needs --allow-egress like every hosted arm.
[arms."gemini-flash"]
harness = "agy"
backend = "google"
model = "gemini-3.8-flash-medium"
sends_disassembly = true
accepted_init = ["gemini-3.8-flash-medium"]
coauthor = "Gemini 3.8 Flash <noreply@google.com>"
max_workers = 1

[arms."gemini-flash".prices]
input = 0.0
output = 0.0
cache_read = 0.0
cache_creation = 0.0

[arms."gpt-oss"]
harness = "agy"
backend = "google"
model = "gpt-oss-120b-medium"
sends_disassembly = true
accepted_init = ["gpt-oss-120b-medium"]
coauthor = "gpt-oss-120b <noreply@openai.com>"
max_workers = 1

[arms."gpt-oss".prices]
input = 0.0
output = 0.0
cache_read = 0.0
cache_creation = 0.0

