# Gemini 3.8 Flash and GPT-OSS 120B through the Antigravity CLI (agy) on the owner's Google AI
# Plus sign-in (07.2-15; D-21, D-24, D-25, D-25a: Gemini is fifth in the run order). No base_url
# and no key_env: agy signs in with its own login, and the driver strips every Google key and
# OpenAI variable from the session. The model ids are the exact slugs the owner's `agy models`
# listed on 2026-11-09 (agy 1.5.3); slugs vary per account and agy exits 1 on an unknown one,
# so a wrong id fails closed in the canary. The Gemini arm runs the medium effort; the owner may
# set `gemini-3.8-flash-high` or `-low` here for an effort comparison. A session's recorded
# cost stays 0: with no base_url this is a subscription arm (backends.Arm.billing), which pays
# no per-token price, and AI Plus is measured in its weekly quota (the canary measures it). Its
# prices are public API list prices, for the comparison of `stats --run` and the `--land-held`
# ranking. One worker each. An agy arm runs only after its canary passed on the installed CLI
# (build/driver/canary/<arm>.json). GPT-OSS is open-weight, but the session still sends the
# pack to Google, so it needs --allow-egress like every hosted arm. max_sessions caps each arm's
# sessions in one night (07.2-16, D-22). 20 is the canary's planning estimate (RESEARCH A8: "a
# 20-session arm fits if tokens x 20 is under the observed weekly bucket"); the owner sets it
# from the quota the agy canary measures, before the arm's first night.
[arms."gemini-flash"]
harness = "agy"
backend = "google"
model = "gemini-3.8-flash-medium"
sends_disassembly = true
accepted_init = ["gemini-3.8-flash-medium"]
coauthor = "Gemini 3.8 Flash <noreply@google.com>"
max_workers = 1
max_sessions = 20

# List prices (USD per MTok), used only for the API-equivalent figure of `stats --run` and the
