# The drive arms (Phase 07.2 plan 12; D-10, D-11, D-12, D-18), read by tools/reverseapoc/backends.py.
#
# This file holds NAMES of environment variables only, never a key. A hosted arm's key lives in
# the Windows user environment variable its `key_env` names (docs/toolchain.md, "Model API keys
# and sign-ins"); the driver copies it into that session's ANTHROPIC_AUTH_TOKEN and writes it
# nowhere.
#
# The endpoints, model ids and prices of the non-Anthropic arms were read on 2026-11-09
# (07.2-RESEARCH Q7) and are re-checked by the owner at setup, before each arm's canary.
#
# Fields: harness (claude, codex, agy), backend (the provider: anthropic is the Claude Code
# login), model (the --model id), base_url (absent on the Claude login), key_env (absent on the
# Claude login), sends_disassembly (true: the context pack leaves the machine, so a
# non-Anthropic arm needs --allow-egress, D-11), accepted_init (the init `model` strings
# accepted), prices (USD per million tokens: a metered arm's recorded cost estimate, and every
# arm's list price for the API-equivalent figure of `stats --run` and the `--land-held` ranking;
# a subscription or free arm records cost 0, backends.Arm.billing), coauthor (the commit
# credit line, D-26), max_workers, and the optional max_sessions (07.2-16, D-22: the sessions
# the arm may launch in one night; absent, only the night's --max-sessions caps it). The Claude
# arms are keyed by their model id and keep streamjson's tables and driver.coauthor (RULINGS
# "Harness").

[arms."claude-opus-5-5"]
harness = "claude"
backend = "anthropic"
model = "claude-opus-5-5"
sends_disassembly = true
max_workers = 10

[arms."claude-fable-5-1"]
harness = "claude"
backend = "anthropic"
model = "claude-fable-5-1"
sends_disassembly = true
max_workers = 10

[arms."claude-haiku-5-5"]
harness = "claude"
backend = "anthropic"
model = "claude-haiku-5-5"
sends_disassembly = true
max_workers = 10

[arms."claude-sonnet-5-5"]
harness = "claude"
backend = "anthropic"
model = "claude-sonnet-5-5"
sends_disassembly = true
max_workers = 10

# GPT-6 Luna and GPT-6.1 Sol through the Codex CLI on the owner's ChatGPT Plus login (07.2-13;
# D-12, D-13, D-18: third and fourth in the run order). No base_url and no key_env: Codex signs
# in with its own login, and the driver strips OPENAI_API_KEY and OPENAI_BASE_URL from the
# session. No init ids: `codex exec --json` streams no event naming the model, so the record
# keeps the requested model and a null `model`. A session's recorded cost stays 0: with no
# base_url this is a subscription arm (backends.Arm.billing), which pays no per-token price, and
# Plus is measured in tokens and its 5-hour windows. Its prices are public API list prices, for
# the comparison of `stats --run` and the `--land-held` ranking. One worker for the Plus
# windows (the owner may raise max_workers). A Codex arm runs only after its canary passed on
# the installed CLI
# (build/driver/canary/<arm>.json). ASSUMPTION, confirm at setup: the ids `gpt-6-luna` and
# `gpt-6.1-sol` (RESEARCH Q8, from OpenAI's help page and CLI 0.159.1's catalogue) and the
# noreply@openai.com co-author address.
[arms."gpt-6-luna"]
harness = "codex"
backend = "openai"
model = "gpt-6-luna"
sends_disassembly = true
accepted_init = []
coauthor = "GPT-6 Luna <noreply@openai.com>"
max_workers = 1

# List prices (USD per MTok), used only for the API-equivalent figure of `stats --run` and the
# `--land-held` ranking; confirm at setup. Source: third-party price trackers, read 2026-11-10.
# cache_creation is priced as input, this file's rule for an unrecorded cache class (it may
# overstate, never understate).
[arms."gpt-6-luna".prices]
input = 0.10
output = 0.50
cache_read = 0.01
cache_creation = 0.10

[arms."gpt-6.1-sol"]
harness = "codex"
backend = "openai"
model = "gpt-6.1-sol"
sends_disassembly = true
accepted_init = []
coauthor = "GPT-6.1 Sol <noreply@openai.com>"
max_workers = 1

# List prices (USD per MTok), used only for the API-equivalent figure of `stats --run` and the
# `--land-held` ranking; confirm at setup. Source: third-party price trackers, read 2026-11-10.
# The price holds for prompts up to 272K tokens. cache_creation is priced as input, this file's
# rule for an unrecorded cache class (it may overstate, never understate).
[arms."gpt-6.1-sol".prices]
input = 2.00
output = 10.00
cache_read = 0.10
cache_creation = 2.00

