# The quota one session of each arm takes from its plan, read by tools/reverseapoc/quota.py for
# `drive --arm-budget NAME=BUDGET` (todo budget-runs-and-contributors). A budget becomes the
# arm's session cap tonight: floor(budget / per session), and never above the arm's
# backends.toml max_sessions. The dry run prints each arm's budget, its quota per session with
# the source and date below, the sessions it buys and the expected matches.
#
# [plans.<id>]: a plan a contributor pays for, named here and nowhere in the code. `name` is
# what the dry run prints; `credit_usd` (optional) is the dollar value of one plan credit, so a
# `$` budget and a `credits` budget convert into each other on that plan. Each plan names
# either the `meter` a night holds a budget against between launches (todo budget-meter-wiring;
# `reverseapoc meters` reads the same sources) or, in `no_meter`, why none moves during a night:
#   meter = "openrouter"  the OpenRouter credits API's total usage, in `$` (the whole account)
#   meter = "credits"     the arm's records' `credits` (each Copilot session's usage file)
#   meter = "cost_usd"    the arm's records' API-equivalent `cost_usd` over `usd_per_week_point`
#                         (dollars per point of the weekly meter, from `point_source`), in `%week`
# A budget in another unit than its plan's meter, or on a plan with no meter, is held by its
# session cap alone, and the budget line says so. A resumed `--hold --run` (todo
# resumed-held-run-budgets) sizes each budget less what that arm's records under the run spent,
# counted the same way (a unit no record measures: at the arm's quota per session).
#
# [arms.<name>]: an arm's quota per session on its `plan`, in any of the budget units:
#   week_percent       percent of the plan's weekly meter one session moves (`<p>%week`)
#   five_hour_percent  percent of the plan's 5-hour window one session moves (`<p>%5h`)
#   usd                dollars one session spends (`$<usd>`)
#   credits            plan credits one session spends (`<n>credits`)
# `source` and `read` (a date) say where and when the figure was read; `estimate = true` marks
# a placeholder nobody measured yet. `matched` of `sessions` is the arm's measured match rate,
# from `rate_source`; without it the dry run says "unmeasured".
#
# An arm here need not be in backends.toml, and an arm of backends.toml need not be here: only
# an arm given an --arm-budget must have an entry. Re-measure these figures when the usage
# meters land (todo usage-meters-per-subscription). The figures: docs/model-routing.md "Quota
# per session" (S: owner's meter screenshot, A: OpenRouter credits API) and
# docs/model-comparison.md "Cascade nights" (recorded sessions, which undercount some arms).

# usd_per_week_point was 17.73 until 2026-11-23 (runs 20261114-opus-sonnet to
# 20261115-claude-push2: $354.59 moved the bar 20 points, 2026-11-16).
[plans."claude-ultra"]
name = "Claude Code Ultra"
meter = "cost_usd"
usd_per_week_point = 9.6
point_source = "run 20261121-mix (59 Fable 5.1 and 46 Opus 5.5 sessions, 2026-11-21): $277.46 of the records' cost_usd moved the owner's weekly bar 6% to 35%, 29 points (read 2026-11-23). The orchestrator session's own use falls in the same window, so the true dollars per point are higher: 9.6 is a lower bound, and a meter at 9.6 stops a budget early, never late. Re-calibrate from a before and after reading of a run that had the bar to itself"

[plans."chatgpt-plus"]
name = "ChatGPT Plus (Codex CLI)"
no_meter = "Codex drive sessions run --ephemeral and write no rollout, so ~/.codex's rate limits date from the last interactive session"

[plans."google-ai-plus"]
name = "Google AI Plus (Antigravity CLI, agy)"
no_meter = "`agy -p /usage` prints nothing machine-readable (spike 012)"

[plans."openrouter"]
name = "OpenRouter credits"
meter = "openrouter"

[plans."copilot-pro"]
name = "GitHub Copilot Pro (AI credits)"
credit_usd = 0.01
meter = "credits"

