[project]
name = "reverseapoc"
version = "0.0.1"
description = "Tooling for a byte-matching decompilation of X-COM Apocalypse (DOS, Watcom LE)"
readme = "README.md"
requires-python = ">=3.14,<3.15"
license = "GPL-3.0-or-later"
dependencies = []

[project.scripts]
reverseapoc = "reverseapoc.cli:main"

[dependency-groups]
dev = [
    "pytest>=9.1",
    "ruff>=0.17",
]

[build-system]
requires = ["hatchling>=1.27"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["tools/reverseapoc"]

[tool.pytest.ini_options]
testpaths = ["tests"]
# configure.py lives at the repo root and is imported by its tests.
pythonpath = ["."]

[tool.ruff]
line-length = 100
target-version = "py314"
src = ["tools", "tests", "."]
extend-exclude = [".agents", ".claude", "docs"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
