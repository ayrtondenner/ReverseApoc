name: Pages

# D-27, D-28: publish the progress page from the committed CSVs. tools/progress.py is stdlib
# only and Python 3.12 syntax, so the runner's own python3 runs it under -I (no uv, no install).
# The site holds progress.json, progress-shield.json and progress.svg; build/report.json goes to
# recomp.fyi as one artifact. Only derived counts and names leave CI, never game bytes: no game
# file exists in a checkout of this repository.

on:
  push:
    branches: [main]
    paths:
      - "config/*/status.csv"
      - "config/*/functions.csv"
      - "config/*/units.csv"
      - "tools/progress.py"
      - "decomphub.progress.json"
      - ".github/workflows/pages.yml"
  # Weekly; also renews the 90-day report artifact before it expires.
  schedule:
    - cron: "17 4 * * 1"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Derive the progress files from the committed CSVs
        run: python3 -I tools/progress.py --out _site --report build/report.json --commit "$GITHUB_SHA"

      # D-28: recomp.fyi reads this artifact by name, daily, from a default-branch run.
      - name: Upload the recomp.fyi report
        uses: actions/upload-artifact@v7
        with:
          name: X-COM_Apocalypse_DOS_report
          path: build/report.json
          retention-days: 90
          if-no-files-found: error

      - name: Upload the Pages site
        uses: actions/upload-pages-artifact@v5
        with:
          path: _site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v5
